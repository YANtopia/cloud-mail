name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail-db"
database_id = ""

[[kv_namespaces]]
binding = "kv"
id = "81191c0f5d7147bb9ff538ccc582611a"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail-attachments"

[[send_email]]
name = "email"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["*/30 * * * *", "0 16 * * *"]

[vars]
analysis_cache = false
orm_log = false
domain = ["paclov.uk"]
admin = "admin@paclov.uk"
jwt_secret = "paclov2026mail"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
